name: Endpoint inventory check

on:
  schedule:
    # Weekly, Monday 09:40 UTC — twenty minutes after the doc-sources check, so the weekly
    # notices do not land in the same minute.
    #
    # Deliberately NOT push/pull_request. Its result depends entirely on a third party's
    # web server: the vendor deploying, rate-limiting a runner, or being down makes this red
    # through no fault of anything in this repository. A per-push blocking job with that
    # failure mode trains reviewers to ignore red, which this family has paid for once.
    - cron: '40 9 * * 1'
  workflow_dispatch:

# Never a required check and never in ci.yml's `publish` job's `needs:` chain. A red run
# here must not block a merge or the release pipeline. It is a notice that the vendor
# changed what it publishes, addressed to a person.
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No setup-beam: this is curl, awk and comm. It reads no Elixir and compiles nothing.
      - run: bash script/check_endpoint_inventory.sh
